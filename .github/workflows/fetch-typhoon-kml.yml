name: Fetch typhoon KML

on:
  schedule:
   - cron: '19,49 * * * *'   # 每 30 分鐘（GitHub 排程可能延遲幾分鐘）
  workflow_dispatch: {}       # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: fetch-typhoon-kml
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch KML with headless Chrome
        run: node scripts/fetch-kml.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/multityroute.kml
            git commit -m "chore: update typhoon KML"
            git push
          else
            echo "KML 沒有變動"
          fi
